# Shared settings for every experiment.
# The assignment (p.3) requires all models to be trained under the same conditions,
# so model-specific values live here too instead of inside notebooks.

seed: 42

data:
  # The assignment's example (jockeroika/diabetic-retinopathy) was deleted from Kaggle (checked
  # 24 Nov 2026). Fallback planned in the report §11: APTOS 2019, same 5-grade ICDR scale,
  # 3,662 colour fundus photos resized to 224 px (CC0).
  kaggle_dataset: sovitrath/diabetic-retinopathy-224x224-2019-data
  root: data/raw
  splits_file: data/splits/folds.csv
  image_size: 224
  # ICDR grades, in order (folders No_DR, Mild, Moderate, Severe, Proliferate_DR).
  class_names: [No DR, Mild, Moderate, Severe, Proliferative]
  test_fraction: 0.15   # frozen, stratified, used once at the very end
  n_folds: 5            # stratified cross-validation on the remaining 85 %

# timm identifiers. "scratch_cnn" is our own small CNN (src/drtl/models.py).
models:
  mobilenetv4: mobilenetv4_conv_small
  densenet201: densenet201
  vgg19: vgg19_bn
  vit_b16: vit_base_patch16_224
  scratch_cnn: scratch_cnn

# Three transfer strategies (assignment title). Learning rates follow the planning report §5.2.
strategies:
  feature_extraction: {head_lr: 1.0e-3, backbone_lr: 0.0}
  partial_finetuning: {head_lr: 1.0e-3, backbone_lr: 1.0e-4, unfreeze_fraction: 0.33}
  full_finetuning:    {head_lr: 1.0e-3, backbone_lr: 3.0e-5}

# The from-scratch CNN has a single strategy: every layer trained, one learning rate (report §5.2).
baseline:
  scratch: {head_lr: 1.0e-3, backbone_lr: 1.0e-3}

training:
  optimizer: adamw
  weight_decay: 1.0e-4
  scheduler: cosine           # cosine decay to 0 over max_epochs, per optimizer step
  warmup_epochs: 1            # linear warm-up before the cosine decay
  batch_size: 32
  accumulation_steps: 1       # VGG19/ViT out of memory: batch_size 16 + accumulation_steps 2
  max_epochs: 30
  early_stopping_patience: 5
  early_stopping_monitor: val_loss      # report §5.3: stop when validation loss stops improving
  checkpoint_monitor: val_macro_f1      # report §6.1: F1 macro is the selection metric
  class_weighted_loss: true   # inverse class frequency, computed on the training folds only
  mixed_precision: true       # only used on CUDA GPUs
  num_workers: 2

# Where runs write. On Kaggle, /kaggle/working/outputs is kept as the notebook's Outputs.
outputs:
  checkpoints_dir: outputs      # weights, logs, resumable state (never committed)
  results_dir: results/runs     # one small JSON + validation predictions per run (committed)
